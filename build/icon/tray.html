<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>NetOS Debug menu bar icon</title>
    <style>
      /*
       * The menu bar icon: the app mark alone, without the squircle or the
       * badge, in black on transparent. macOS treats it as a template image —
       * only the alpha counts, and the menu bar tints it for light and dark —
       * so the colour here is irrelevant and the opacity is everything.
       *
       * 1024px stands for 16pt — the same window as the app icon is captured
       * from. The mark is 768px high, leaving 2pt above and below so it sits at
       * the size of the icons around it rather than crowding the bar.
       * build/icon/render.mjs captures this once per opacity and scales each
       * capture down to 16 and 32px.
       */
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
      }

      .canvas {
        width: 1024px;
        height: 1024px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #000;
      }

      /* The pulse: the same mark, fainter, played back in sequence. */
      body[data-opacity='75'] .mark {
        opacity: 0.75;
      }

      body[data-opacity='50'] .mark {
        opacity: 0.5;
      }

      body[data-opacity='30'] .mark {
        opacity: 0.3;
      }
    </style>
  </head>
  <body data-opacity="100">
    <div class="canvas">
      <!-- The flat variant from icon.html: it is the one drawn for small sizes. -->
      <svg class="mark" viewBox="0 0 20.6 20" width="791" height="768" fill="none">
        <path
          fill="currentColor"
          fill-opacity="0.55"
          d="M20.104 4.1664C20.104 1.97579 18.3308 0.199951 16.1436 0.199951C13.9563 0.199951 12.1832 1.97579 12.1832 4.1664V16.0335C12.1832 18.2241 13.9563 20 16.1436 20C18.3308 20 20.104 18.2241 20.104 16.0335V4.1664Z"
        ></path>
        <path
          fill="currentColor"
          fill-opacity="0.55"
          d="M0.500024 16.0336C0.500024 18.2242 2.31748 20 4.55943 20C6.80138 20 8.61884 18.2242 8.61884 16.0336L8.61884 4.16645C8.61884 1.97584 6.80138 0.200001 4.55943 0.200001C2.31748 0.200001 0.500024 1.97584 0.500024 4.16645L0.500024 16.0336Z"
        ></path>
        <path
          fill="currentColor"
          d="M18.6721 12.8453C20.6127 14.4597 20.4501 17.2327 18.9674 18.8163C17.4175 20.3484 14.7076 20.5266 13.1206 18.5495C11.8554 16.9812 12.0906 15.2827 11.3647 13.7398C10.8944 12.7042 10.21 11.7238 9.42227 10.908C8.61771 10.1013 7.65576 9.4067 6.64166 8.93007C5.12979 8.19477 3.47117 8.44349 1.9319 7.15559C-0.0087744 5.54119 0.153898 2.76823 1.63659 1.18459C3.1856 -0.348407 5.89545 -0.526582 7.48247 1.45049C8.74766 3.01876 8.51249 4.71726 9.23837 6.26021C9.70872 7.29577 10.3922 8.27617 11.1808 9.09196C11.9854 9.89871 12.9473 10.5933 13.9614 11.0699C15.4733 11.8052 17.1319 11.5574 18.6712 12.8444Z"
        ></path>
      </svg>
    </div>
  </body>
</html>
