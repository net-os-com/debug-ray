appId: com.net-os.debug
productName: NetOS Debug

directories:
  output: dist

# out/** is the electron-vite build. resources/ has to come along because
# src/main/app-icon.ts reads resources/icon.png at runtime, which resolves
# inside app.asar once packaged.
files:
  - out/**
  - resources/icon.png
  # electron-updater is left unbundled by electron-vite's externalizeDepsPlugin,
  # which externalises everything in `dependencies`. Without node_modules here
  # the packaged app would start and immediately fail on a missing import — and
  # only in a release build, never in dev. electron-builder prunes
  # devDependencies from this itself.
  - node_modules/**

mac:
  target:
    - target: dmg
      arch: arm64
    # The zip is a plain archive of the .app, for anyone who would rather not
    # mount a disk image.
    - target: zip
      arch: arm64
  icon: resources/icon.icns
  category: public.app-category.developer-tools
  # Required for notarisation. Signing itself is driven by the environment:
  # CI supplies a Developer ID certificate, local builds set
  # CSC_IDENTITY_AUTO_DISCOVERY=false and stay unsigned.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  title: NetOS Debug

publish:
  provider: github
  owner: net-os-com
  repo: debug-ray
